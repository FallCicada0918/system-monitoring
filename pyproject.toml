[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-pulse"
version = "2.0.0"
description = "Futuristic Cyberpunk System Telemetry & Process Surveillance CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CYBER_PULSE Team" }
]
dependencies = [
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
window = ["pywebview>=4.0.0"]

[project.scripts]
cpulse = "cyber_pulse.cli:main"
cyber-pulse = "cyber_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cyber_pulse*"]

[tool.setuptools.package-data]
cyber_pulse = ["static/**", "static/css/*", "static/js/*"]
